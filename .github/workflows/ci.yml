name: CI

# Lint, typecheck, build and the offline tests on the current Node and the active LTS. The live
# smoke test never runs here: Google's budget is per IP, and a shared runner IP is someone else's
# budget too. No dependency cache: four dev dependencies install faster than a cache restores.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 15 * *" # monthly: catch Node/TypeScript drift while the repo is quiet
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts/*, current]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: package contents
        run: npm pack --dry-run --ignore-scripts
