name: Dependency health

# The published package has no runtime dependencies, so an SBOM of what ships is empty. This audits
# the dev toolchain instead, because the release job runs `npm ci` with it while holding an OIDC
# token that can publish. Gated on vulnerabilities only: the maintenance flags are small finished
# vitest transitives (stackback, siginfo) that we don't control, so they stay informational in the
# Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 8 * *" # monthly
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
      actions: read # upload-sarif reads the run; required on private repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: CycloneDX SBOM of the lockfile (npm's own)
        # --package-lock-only: there's no node_modules here, and without it npm sbom exits ESBOMPROBLEMS.
        run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom.json
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "4.0"
      - uses: SeanLF/still_active-action@934c8ccee4f0f160be53f5e169d5844483f7a3ed # v0.4.1
        with:
          sbom: sbom.json
          fail-if-vulnerable: high
          bundler-audit: "false" # Ruby-only advisory db; npm advisories come via deps.dev + OSV
          github-token: ${{ github.token }}
          sarif: still_active.sarif.json
      # Code scanning on a private repo needs GitHub Code Security, so the Security-tab report
      # waits until the repo is public. The vulnerability gate above runs either way.
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && !github.event.repository.private
        with:
          sarif_file: still_active.sarif.json
