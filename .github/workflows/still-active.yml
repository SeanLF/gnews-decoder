name: Dependency health

# The published package has no runtime dependencies, so an SBOM of what ships is empty. This audits
# the dev toolchain instead: it builds the dist/ that ships, in a job with no credential, and a
# compromised tool there would poison the tarball a maintainer is then asked to approve. Gated on vulnerabilities only: the maintenance flags are small finished
# vitest transitives (stackback, siginfo) that we don't control, so they stay informational in the
# Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 8 * *" # monthly
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
      actions: read # upload-sarif reads the run; required on private repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: CycloneDX SBOM of the lockfile (npm's own)
        # --package-lock-only: there's no node_modules here, and without it npm sbom exits ESBOMPROBLEMS.
        run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom.json
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
      - uses: SeanLF/still_active-action@03e85060785c8769c7e71de7a592719bf41813ea # v0.5.0
        with:
          sbom: sbom.json
          fail-if-vulnerable: high
          bundler-audit: "false" # Ruby-only advisory db; npm advisories come via deps.dev + OSV
          github-token: ${{ github.token }}
          sarif: still_active.sarif.json
      # Code scanning on a private repo needs GitHub Code Security, so the Security-tab report
      # waits until the repo is public. The vulnerability gate above runs either way.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && !github.event.repository.private
        with:
          sarif_file: still_active.sarif.json
