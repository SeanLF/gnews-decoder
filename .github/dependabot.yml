version: 2
updates:
  # A 7-day cooldown on version updates (zizmor's threshold): most compromised releases are caught
  # and pulled within days, and a four-package toolchain gains nothing from a release sooner.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      dev: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
